name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  php-tests:
    name: PHP tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, sqlite3, gd, zip, bcmath
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build assets
        # Feature tests that hit real Inertia pages render app.blade.php's
        # @vite directive, which needs public/build/manifest.json — without
        # this, every such test fails with "Vite manifest not found".
        run: npm run build

      - name: Run tests
        # phpunit.xml pins sqlite :memory:, array cache/session, and sync queue,
        # so no external database or services are required.
        run: php artisan test

  frontend:
    name: Frontend build & i18n audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Audit i18n key parity (ar/en)
        run: npm run i18n:audit

      - name: Build assets
        run: npm run build

  deploy:
    name: Deploy to production
    needs: [php-tests, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      # Temporary diagnostic. The deploy step below fails with
      # "dial tcp ***:***: i/o timeout", which narrows to either a wrong
      # SSH_PORT secret or a firewall dropping GitHub's runner IPs. Probing
      # the configured port and port 22 separately tells the two apart:
      # 22 open but configured port timing out => the secret is wrong;
      # both timing out => the firewall is dropping this runner.
      # Only lengths are printed, never the secret values. Remove once fixed.
      - name: Probe SSH connectivity
        env:
          HOST: ${{ secrets.SSH_HOST }}
          PORT: ${{ secrets.SSH_PORT || 22 }}
        run: |
          echo "runner public IP: $(curl -s --max-time 10 https://api.ipify.org)"
          echo "host length: ${#HOST} (expect 11)"
          echo "port length: ${#PORT} (expect 2)"
          echo "--- configured port ---"
          nc -vz -w 10 "$HOST" "$PORT" || echo "FAILED on configured port"
          echo "--- port 22 explicitly ---"
          nc -vz -w 10 "$HOST" 22 || echo "FAILED on port 22"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            git pull origin main
            composer install --no-dev --optimize-autoloader --no-interaction
            npm ci
            npm run build
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan queue:restart
