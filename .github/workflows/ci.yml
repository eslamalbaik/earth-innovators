name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  php-tests:
    name: PHP tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, sqlite3, gd, zip, bcmath
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build assets
        # Feature tests that hit real Inertia pages render app.blade.php's
        # @vite directive, which needs public/build/manifest.json — without
        # this, every such test fails with "Vite manifest not found".
        run: npm run build

      - name: Run tests
        # phpunit.xml pins sqlite :memory:, array cache/session, and sync queue,
        # so no external database or services are required.
        run: php artisan test

  frontend:
    name: Frontend build & i18n audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Audit i18n key parity (ar/en)
        run: npm run i18n:audit

      - name: Build assets
        run: npm run build

  deploy:
    name: Deploy to production
    needs: [php-tests, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The SSH connection currently times out before the deploy can start, which
    # was marking every run on main as failed even though the tests passed.
    # This keeps the run green while the connectivity issue is being tracked
    # down; the job still reports its own failure, so a broken deploy is still
    # visible. Remove this once the deploy connects, otherwise a genuinely
    # failing deploy will be silently ignored.
    continue-on-error: true

    steps:
      # Temporary diagnostic. The deploy step below fails with
      # "dial tcp ***:***: i/o timeout", which narrows to either a wrong
      # SSH_PORT secret or a firewall dropping GitHub's runner IPs. Probing
      # the configured port and port 22 separately tells the two apart:
      # 22 open but configured port timing out => the secret is wrong;
      # both timing out => the firewall is dropping this runner.
      # Only lengths are printed, never the secret values. Remove once fixed.
      - name: Probe SSH connectivity
        env:
          HOST: ${{ secrets.SSH_HOST }}
          PORT: ${{ secrets.SSH_PORT || 22 }}
        run: |
          echo "runner public IP: $(curl -s --max-time 10 https://api.ipify.org)"
          echo "host length: ${#HOST} (expect 11)"
          echo "port length: ${#PORT} (expect 2)"
          echo "--- configured port ---"
          nc -vz -w 10 "$HOST" "$PORT" || echo "FAILED on configured port"
          echo "--- port 22 explicitly ---"
          nc -vz -w 10 "$HOST" 22 || echo "FAILED on port 22"

      # Proves the SSH host, port, key and deploy path are all correct without
      # changing anything on the server: every command here only reads state.
      # migrate:status is a plain query against the migrations table, so it
      # reports the pending backlog without applying any of it.
      - name: Verify SSH access (read-only)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: false
          script: |
            echo "connected as: $(whoami)@$(hostname)"
            cd ${{ secrets.DEPLOY_PATH }} || { echo "DEPLOY_PATH not reachable"; exit 1; }
            echo "path: $(pwd)"
            echo "--- current checkout ---"
            git log --oneline -1 || true
            git status --short || true
            echo "--- pending migrations (not applied) ---"
            php artisan migrate:status 2>/dev/null | grep -ci pending || echo "0 (or status unavailable)"

      # Disabled by default. This runs composer/npm installs and, critically,
      # `php artisan migrate --force`, which applies every pending migration to
      # the production database without prompting. Set the repository variable
      # DEPLOY_ENABLED to "true" only once the read-only check above looks right
      # and the pending-migration backlog has been reviewed.
      - name: Deploy over SSH
        if: vars.DEPLOY_ENABLED == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            git pull origin main
            composer install --no-dev --optimize-autoloader --no-interaction
            npm ci
            npm run build
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan queue:restart
